<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Letter For You</title>
  <style>
    :root {
      --snow: #e8f4f8;
      --ice: #b8d4e3;
      --deep-ice: #8eb8cc;
      --paper: #f7f1e3;
      --ink: #2c2c2c;
      --crystal: rgba(180, 220, 240, 0.55);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Georgia', 'Times New Roman', serif;
      background: linear-gradient(165deg, #c5dce8 0%, #dceaf2 35%, #e8f2f7 70%, #f0f6fa 100%);
      color: var(--ink);
      touch-action: manipulation;
    }

    /* Soft atmospheric fog + frost vignette */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 50% 20%, rgba(255,255,255,0.45) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(170, 200, 220, 0.25) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }

    /* Frost edge overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        linear-gradient(to right, rgba(200,230,245,0.15) 0%, transparent 8%, transparent 92%, rgba(200,230,245,0.15) 100%),
        linear-gradient(to bottom, rgba(220,240,250,0.2) 0%, transparent 12%);
      pointer-events: none;
      z-index: 2;
    }

    /* Distant snowy landscape */
    .landscape {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 32%;
      background: linear-gradient(180deg, transparent 0%, rgba(190, 215, 230, 0.35) 45%, rgba(170, 200, 220, 0.55) 100%);
      z-index: 0;
      pointer-events: none;
    }

    .landscape::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: -10%;
      width: 120%;
      height: 70%;
      background: 
        radial-gradient(ellipse 42% 35% at 18% 100%, rgba(185, 210, 225, 0.65) 0%, transparent 70%),
        radial-gradient(ellipse 55% 42% at 72% 100%, rgba(175, 200, 220, 0.55) 0%, transparent 70%),
        radial-gradient(ellipse 28% 28% at 48% 100%, rgba(195, 215, 230, 0.45) 0%, transparent 70%);
    }

    /* WebGL snow + crystals canvas */
    #snow-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Floating ice crystals (CSS layer for sharp geometric ones) */
    .ice-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      overflow: hidden;
    }

    .crystal {
      position: absolute;
      width: 10px;
      height: 10px;
      background: linear-gradient(135deg, rgba(255,255,255,0.85), rgba(170,215,240,0.4));
      clip-path: polygon(50% 0%, 65% 35%, 100% 35%, 70% 57%, 82% 100%, 50% 75%, 18% 100%, 30% 57%, 0% 35%, 35% 35%);
      opacity: 0;
      animation: crystalFall linear infinite;
      filter: drop-shadow(0 0 2px rgba(200,230,250,0.5));
    }

    @keyframes crystalFall {
      0% {
        transform: translateY(-5vh) rotate(0deg) scale(0.6);
        opacity: 0;
      }
      12% { opacity: 0.7; }
      85% { opacity: 0.5; }
      100% {
        transform: translateY(105vh) rotate(220deg) scale(0.9);
        opacity: 0;
      }
    }

    /* Book container */
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      perspective: 1800px;
    }

    .book-wrapper {
      position: relative;
      width: min(84vw, 340px);
      height: min(68vh, 510px);
      max-height: 510px;
      transform-style: preserve-3d;
    }

    .book {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      box-shadow: 
        0 22px 45px -12px rgba(30, 55, 75, 0.38),
        0 8px 18px -5px rgba(30, 55, 75, 0.22),
        0 0 0 1px rgba(255,255,255,0.18),
        inset 0 0 0 1px rgba(255,255,255,0.08);
      border-radius: 2px 7px 7px 2px;
    }

    /* Subtle ice rim on the book */
    .book-wrapper::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 4px 10px 10px 4px;
      background: linear-gradient(145deg, rgba(200,230,250,0.35), transparent 40%, transparent 60%, rgba(180,215,240,0.2));
      z-index: -1;
      pointer-events: none;
      filter: blur(1px);
    }

    /* Book cover base (left side spine feel) */
    .book::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 10px;
      background: linear-gradient(90deg, #cfc4aa, #e4d9c0);
      border-radius: 2px 0 0 2px;
      z-index: 20;
      box-shadow: inset -2px 0 4px rgba(0,0,0,0.08);
    }

    .page {
      position: absolute;
      inset: 0;
      background: var(--paper);
      background-image: 
        linear-gradient(90deg, rgba(0,0,0,0.03) 0%, transparent 7%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      border-radius: 1px 6px 6px 1px;
      padding: 7.5% 8.5% 7.5% 10.5%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      transform-origin: left center;
      transition: transform 1.05s cubic-bezier(0.645, 0.045, 0.355, 1), box-shadow 1.05s ease;
      backface-visibility: hidden;
      box-shadow: inset 0 0 28px rgba(0,0,0,0.025);
    }

    .page.flipped {
      transform: rotateY(-180deg);
      box-shadow: -5px 0 14px rgba(0,0,0,0.1);
      z-index: 1;
    }

    .page-content {
      font-size: clamp(14px, 3.6vw, 16px);
      line-height: 1.7;
      color: #2a2a2a;
      letter-spacing: 0.01em;
      text-align: left;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 100%;
      overflow: hidden;
    }

    .page::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 80% 20%, rgba(220, 200, 160, 0.07) 0%, transparent 50%);
      pointer-events: none;
      border-radius: inherit;
    }

    .tap-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 50;
      cursor: pointer;
    }

    .tap-left { left: 0; }
    .tap-right { right: 0; }

    .page-num {
      position: absolute;
      bottom: 3.5%;
      right: 7%;
      font-size: 10.5px;
      color: #8a8070;
      opacity: 0.55;
      font-family: Georgia, serif;
    }

    .book-wrapper::after {
      content: '';
      position: absolute;
      bottom: -28px;
      left: 12%;
      width: 76%;
      height: 36px;
      background: radial-gradient(ellipse, rgba(255,255,255,0.55) 0%, transparent 70%);
      filter: blur(9px);
      z-index: -1;
      pointer-events: none;
    }

    .hint {
      position: fixed;
      bottom: 5.5%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: #5a7a8a;
      opacity: 0;
      transition: opacity 1.5s ease;
      z-index: 30;
      pointer-events: none;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 3px rgba(255,255,255,0.85);
    }

    .hint.visible {
      opacity: 0.75;
    }

    /* ===== Response panel – cooler ice UI ===== */
    .response-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.3s ease;
      background: rgba(180, 210, 225, 0.28);
      backdrop-filter: blur(4px);
    }

    .response-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .response-card {
      position: relative;
      width: min(88vw, 360px);
      background: linear-gradient(165deg, #f8f4ec 0%, #f3eee3 100%);
      border-radius: 6px;
      padding: 30px 26px 26px;
      box-shadow: 
        0 22px 44px -12px rgba(30, 55, 75, 0.32),
        0 0 0 1px rgba(180, 215, 235, 0.35),
        inset 0 1px 0 rgba(255,255,255,0.7);
      transform: translateY(22px) scale(0.97);
      transition: transform 1.15s cubic-bezier(0.22, 1, 0.36, 1);
      text-align: center;
      overflow: hidden;
    }

    /* Ice crystal corner accents */
    .response-card::before,
    .response-card::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, rgba(200,230,250,0.7), rgba(160,205,230,0.25));
      clip-path: polygon(50% 0%, 65% 35%, 100% 35%, 70% 57%, 82% 100%, 50% 75%, 18% 100%, 30% 57%, 0% 35%, 35% 35%);
      opacity: 0.55;
      pointer-events: none;
    }

    .response-card::before {
      top: 12px;
      left: 14px;
      transform: rotate(-15deg) scale(0.85);
    }

    .response-card::after {
      bottom: 12px;
      right: 14px;
      transform: rotate(25deg) scale(0.7);
    }

    .response-overlay.visible .response-card {
      transform: translateY(0) scale(1);
    }

    .response-card h2 {
      font-size: 17px;
      font-weight: normal;
      color: #2e3a42;
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }

    .response-card > p {
      font-size: 13px;
      color: #6a7580;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .response-buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .response-btn {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 16px;
      padding: 12px 32px;
      border: 1px solid rgba(140, 185, 210, 0.55);
      background: linear-gradient(180deg, rgba(255,255,255,0.75) 0%, rgba(220,235,245,0.45) 100%);
      color: #243038;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.22s ease;
      min-width: 100px;
      box-shadow: 0 2px 8px rgba(100, 150, 180, 0.12);
      letter-spacing: 0.02em;
    }

    .response-btn:hover,
    .response-btn:focus {
      background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(200,225,240,0.6) 100%);
      border-color: rgba(120, 175, 205, 0.75);
      box-shadow: 0 4px 14px rgba(100, 160, 190, 0.2);
      outline: none;
      transform: translateY(-1px);
    }

    .response-btn:active {
      transform: translateY(0) scale(0.97);
    }

    .response-or {
      font-size: 12px;
      color: #7a8a95;
      margin-bottom: 11px;
      letter-spacing: 0.03em;
    }

    .response-textarea {
      width: 100%;
      min-height: 78px;
      max-height: 130px;
      resize: vertical;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14.5px;
      line-height: 1.5;
      color: #2a2a2a;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(160, 195, 215, 0.45);
      border-radius: 4px;
      padding: 11px 13px;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .response-textarea:focus {
      border-color: rgba(120, 175, 205, 0.7);
      box-shadow: 0 0 0 3px rgba(160, 205, 230, 0.2);
    }

    .response-textarea::placeholder {
      color: #9aabba;
    }

    .response-send {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14px;
      padding: 11px 28px;
      border: 1px solid rgba(120, 175, 205, 0.6);
      background: linear-gradient(180deg, #e8f4fa 0%, #d0e8f2 100%);
      color: #1e3038;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.22s ease;
      letter-spacing: 0.02em;
      box-shadow: 0 2px 10px rgba(100, 150, 180, 0.15);
    }

    .response-send:hover:not(:disabled) {
      background: linear-gradient(180deg, #f0f8fc 0%, #c5e0ed 100%);
      box-shadow: 0 4px 16px rgba(100, 160, 190, 0.22);
      transform: translateY(-1px);
    }

    .response-send:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .response-thanks {
      display: none;
      font-size: 15.5px;
      color: #2e3a42;
      line-height: 1.65;
      padding: 16px 8px 6px;
    }

    .response-thanks.visible {
      display: block;
    }

    .close-response {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 20px;
      color: #8a9aa5;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
      z-index: 2;
    }

    .close-response:hover {
      color: #5a6a75;
    }

    @media (max-height: 600px) {
      .book-wrapper {
        height: min(72vh, 460px);
      }
      .page-content {
        font-size: clamp(13px, 3.3vw, 14.5px);
        line-height: 1.58;
      }
    }

    @media (max-width: 380px) {
      .page {
        padding: 6.5% 7% 6.5% 9.5%;
      }
      .page-content {
        font-size: 13.8px;
      }
      .response-card {
        padding: 26px 18px 22px;
      }
      .response-btn {
        padding: 11px 24px;
        min-width: 88px;
      }
    }
  </style>
</head>
<body>
  <div class="landscape"></div>
  <canvas id="snow-canvas"></canvas>
  <div class="ice-layer" id="iceLayer"></div>

  <div class="scene">
    <div class="book-wrapper">
      <div class="book" id="book"></div>
      <div class="tap-zone tap-left" id="tapLeft"></div>
      <div class="tap-zone tap-right" id="tapRight"></div>
    </div>
  </div>

  <div class="hint" id="hint">Tap the right side to turn the page</div>

  <div class="response-overlay" id="responseOverlay">
    <div class="response-card">
      <button class="close-response" id="closeResponse" aria-label="Close">×</button>

      <div id="responseForm">
        <h2>Your answer</h2>
        <p>Yes, no, or whatever you genuinely feel.</p>

        <div class="response-buttons" id="responseButtons">
          <button class="response-btn" data-answer="Yes">Yes</button>
          <button class="response-btn" data-answer="No">No</button>
        </div>

        <div class="response-or">or write it in your own words</div>

        <textarea
          class="response-textarea"
          id="responseText"
          placeholder="Whatever feels true…"
          maxlength="1500"
        ></textarea>

        <button class="response-send" id="responseSend" disabled>Send answer</button>
      </div>

      <div class="response-thanks" id="responseThanks">
        It’s on its way.<br>
        Whatever you chose is enough.
      </div>
    </div>
  </div>

  <script>
    const pages = [
      `Hey, I just want to make one last deal with you, and I’m going to be completely honest about it.`,

      `I’m currently working on something that means a lot to me. For the first time in a while, I feel like I’m starting to understand that maybe my existence isn’t meaningless or absurd. Maybe I simply haven’t discovered what I’m meant to find yet.`,

      `So this is my deal. You can answer yes, no, or give me whatever answer you genuinely feel is right.`,

      `I’m going to disappear for 165 days. I know you may have wished for me to disappear from your life completely, and I understand that. But there’s something I promised myself after everything we shared throughout our relationship, and I want to keep that promise. I don’t want the ending of our relationship to be defined by becoming strangers.`,

      `After those 165 days, I may contact you again. There’s also a chance I won’t. I honestly don’t know what the future will bring, and I don’t want to make any promises about something I can’t control.`,

      `If you happen to have a boyfriend by then, I hope you can tell him about this agreement if you think it’s necessary. I don’t want to cause problems for you or for anyone else. This isn’t meant to threaten you, pressure you, or interfere with your life. I’m simply giving myself these 165 days to work on something important.`,

      `There’s also something I want to give you. It’s a secret for now, so I won’t tell you what it is. Whether I actually get the chance to give it to you is something I don’t know yet.\n\nSo, goodbye for now. Take care of yourself, and I genuinely hope life treats you well. Whatever happens after these 165 days, I’ll accept it.`
    ];

    const book = document.getElementById('book');
    let currentPage = 0;
    let isAnimating = false;
    let responseShown = false;

    function buildPages() {
      pages.forEach((text, i) => {
        const page = document.createElement('div');
        page.className = 'page';
        page.dataset.index = i;
        page.style.zIndex = pages.length - i;

        const content = document.createElement('div');
        content.className = 'page-content';
        content.textContent = text;

        const num = document.createElement('div');
        num.className = 'page-num';
        num.textContent = `${i + 1}`;

        page.appendChild(content);
        page.appendChild(num);
        book.appendChild(page);
      });
    }

    function updateVisibility() {
      document.querySelectorAll('.page').forEach((page, i) => {
        if (i < currentPage) {
          page.classList.add('flipped');
          page.style.zIndex = i;
        } else {
          page.classList.remove('flipped');
          page.style.zIndex = pages.length - i;
        }
      });
    }

    function showResponsePanel() {
      if (responseShown) return;
      setTimeout(() => {
        document.getElementById('responseOverlay').classList.add('visible');
        responseShown = true;
      }, 1500);
    }

    function goNext() {
      if (isAnimating) return;

      if (currentPage >= pages.length - 1) {
        showResponsePanel();
        return;
      }

      isAnimating = true;
      currentPage++;
      updateVisibility();
      playPageSound();

      if (currentPage === pages.length - 1) {
        setTimeout(() => {
          isAnimating = false;
          showResponsePanel();
        }, 1100);
      } else {
        setTimeout(() => { isAnimating = false; }, 1100);
      }
    }

    function goPrev() {
      if (isAnimating || currentPage <= 0) return;
      isAnimating = true;
      currentPage--;
      updateVisibility();
      playPageSound();
      setTimeout(() => { isAnimating = false; }, 1100);
    }

    let audioCtx;
    function playPageSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const bufferSize = audioCtx.sampleRate * 0.14;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.5) * 0.14;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1150;
        filter.Q.value = 0.8;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
      } catch (e) {}
    }

    // ===== Answer → GitHub Issue =====
    const REPO_ISSUES = 'https://github.com/kevinmatangong-eng/Letter.For.You/issues/new';

    function sendToRepo(answer) {
      const title = encodeURIComponent('Answer to the letter');
      const body = encodeURIComponent(
        '**Answer:**\n\n' + answer + '\n\n---\n*Sent from the letter book*'
      );
      const url = `${REPO_ISSUES}?title=${title}&body=${body}`;

      // Open GitHub issue form (visitor just needs to click "Submit new issue")
      window.open(url, '_blank', 'noopener');

      try {
        localStorage.setItem('letter-for-you-answer', JSON.stringify({
          answer,
          timestamp: new Date().toISOString()
        }));
      } catch (e) {}
    }

    const responseOverlay = document.getElementById('responseOverlay');
    const responseText = document.getElementById('responseText');
    const responseSend = document.getElementById('responseSend');
    const responseThanks = document.getElementById('responseThanks');
    const responseForm = document.getElementById('responseForm');

    function showThanks() {
      responseForm.style.display = 'none';
      responseThanks.classList.add('visible');
      setTimeout(() => {
        responseOverlay.classList.remove('visible');
      }, 3800);
    }

    document.querySelectorAll('.response-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        sendToRepo(btn.dataset.answer);
        showThanks();
      });
    });

    responseText.addEventListener('input', () => {
      responseSend.disabled = responseText.value.trim().length === 0;
    });

    responseSend.addEventListener('click', () => {
      const text = responseText.value.trim();
      if (!text) return;
      sendToRepo(text);
      showThanks();
    });

    document.getElementById('closeResponse').addEventListener('click', () => {
      responseOverlay.classList.remove('visible');
    });

    responseOverlay.addEventListener('click', (e) => {
      if (e.target === responseOverlay) {
        responseOverlay.classList.remove('visible');
      }
    });

    // ===== CSS ice crystals =====
    function spawnCrystals() {
      const layer = document.getElementById('iceLayer');
      for (let i = 0; i < 14; i++) {
        const c = document.createElement('div');
        c.className = 'crystal';
        c.style.left = Math.random() * 100 + '%';
        c.style.animationDuration = (11 + Math.random() * 14) + 's';
        c.style.animationDelay = (Math.random() * 16) + 's';
        c.style.transform = `scale(${0.5 + Math.random() * 0.9})`;
        layer.appendChild(c);
      }
    }

    // ===== WebGL Snow + soft crystals =====
    (function initWebGLSnow() {
      const canvas = document.getElementById('snow-canvas');
      const gl = canvas.getContext('webgl', {
        alpha: true,
        premultipliedAlpha: false,
        antialias: false,
        depth: false
      });
      if (!gl) return;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        gl.viewport(0, 0, canvas.width, canvas.height);
      }
      resize();
      window.addEventListener('resize', resize);

      const vsSource = `
        attribute vec2 a_position;
        attribute float a_size;
        attribute float a_alpha;
        attribute float a_phase;
        uniform vec2 u_resolution;
        varying float v_alpha;
        varying float v_phase;
        void main() {
          vec2 clip = (a_position / u_resolution) * 2.0 - 1.0;
          clip.y = -clip.y;
          gl_Position = vec4(clip, 0.0, 1.0);
          gl_PointSize = a_size;
          v_alpha = a_alpha;
          v_phase = a_phase;
        }
      `;

      const fsSource = `
        precision mediump float;
        varying float v_alpha;
        varying float v_phase;
        void main() {
          vec2 c = gl_PointCoord - 0.5;
          float dist = length(c);
          float alpha = smoothstep(0.5, 0.12, dist);

          // Soft crystalline facets
          float angle = atan(c.y, c.x);
          float facets = 0.75 + 0.25 * cos(angle * 6.0 + v_phase);
          alpha *= facets;

          // Cool ice tint
          vec3 color = mix(vec3(0.88, 0.94, 0.99), vec3(1.0), 0.55);
          gl_FragColor = vec4(color, alpha * v_alpha * 0.82);
        }
      `;

      function createShader(type, source) {
        const s = gl.createShader(type);
        gl.shaderSource(s, source);
        gl.compileShader(s);
        return s;
      }

      const vs = createShader(gl.VERTEX_SHADER, vsSource);
      const fs = createShader(gl.FRAGMENT_SHADER, fsSource);
      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      gl.useProgram(program);

      const aPosition = gl.getAttribLocation(program, 'a_position');
      const aSize = gl.getAttribLocation(program, 'a_size');
      const aAlpha = gl.getAttribLocation(program, 'a_alpha');
      const aPhase = gl.getAttribLocation(program, 'a_phase');
      const uResolution = gl.getUniformLocation(program, 'u_resolution');

      const isMobile = /Mobi|Android/i.test(navigator.userAgent) || window.innerWidth < 700;
      const PARTICLE_COUNT = isMobile ? 480 : 860;

      const particles = [];
      const positions = new Float32Array(PARTICLE_COUNT * 2);
      const sizes = new Float32Array(PARTICLE_COUNT);
      const alphas = new Float32Array(PARTICLE_COUNT);
      const phases = new Float32Array(PARTICLE_COUNT);

      function createParticle(i, resetY = false) {
        const depth = Math.random();
        particles[i] = {
          x: Math.random() * canvas.width,
          y: resetY ? -25 - Math.random() * 90 : Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: 0.32 + depth * 0.95 + Math.random() * 0.38,
          size: (1.3 + depth * 5.2 + Math.random() * 1.5) * (window.devicePixelRatio > 1.5 ? 1.12 : 1),
          alpha: 0.22 + depth * 0.5 + Math.random() * 0.14,
          phase: Math.random() * Math.PI * 2,
          depth,
          turbulence: 0.28 + Math.random() * 0.75
        };
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) createParticle(i);

      const posBuffer = gl.createBuffer();
      const sizeBuffer = gl.createBuffer();
      const alphaBuffer = gl.createBuffer();
      const phaseBuffer = gl.createBuffer();

      function upload() {
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, sizes, gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, alphaBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, alphas, gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, phaseBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, phases, gl.DYNAMIC_DRAW);
      }

      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.clearColor(0, 0, 0, 0);

      let wind = 0, windTarget = 0, gustTimer = 0;
      let lastTime = performance.now();

      function update(dt) {
        gustTimer -= dt;
        if (gustTimer <= 0) {
          windTarget = (Math.random() - 0.5) * 1.2;
          gustTimer = 2.2 + Math.random() * 5;
        }
        wind += (windTarget - wind) * 0.42 * dt;

        const w = canvas.width, h = canvas.height;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const p = particles[i];
          p.vy += 0.013 * dt;
          p.vy = Math.min(p.vy, 1.65 + p.depth * 1.35);

          const turb = Math.sin(p.phase + performance.now() * 0.00115 * p.turbulence) * 0.48 * p.turbulence;
          p.vx += (wind * (0.38 + p.depth * 0.62) + turb - p.vx) * 0.82 * dt;

          p.x += p.vx * 60 * dt;
          p.y += p.vy * 60 * dt;
          p.phase += 0.85 * dt * p.turbulence;

          let a = p.alpha;
          if (p.y < 45) a *= p.y / 45;

          if (p.y > h + 35 || p.x < -50 || p.x > w + 50) {
            createParticle(i, true);
            continue;
          }

          positions[i * 2] = p.x;
          positions[i * 2 + 1] = p.y;
          sizes[i] = p.size;
          alphas[i] = a;
          phases[i] = p.phase;
        }
      }

      function render() {
        const now = performance.now();
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        update(dt);

        gl.uniform2f(uResolution, canvas.width, canvas.height);

        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, positions);
        gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuffer);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, sizes);
        gl.bindBuffer(gl.ARRAY_BUFFER, alphaBuffer);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, alphas);
        gl.bindBuffer(gl.ARRAY_BUFFER, phaseBuffer);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, phases);

        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.enableVertexAttribArray(aPosition);
        gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuffer);
        gl.enableVertexAttribArray(aSize);
        gl.vertexAttribPointer(aSize, 1, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, alphaBuffer);
        gl.enableVertexAttribArray(aAlpha);
        gl.vertexAttribPointer(aAlpha, 1, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, phaseBuffer);
        gl.enableVertexAttribArray(aPhase);
        gl.vertexAttribPointer(aPhase, 1, gl.FLOAT, false, 0, 0);

        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.POINTS, 0, PARTICLE_COUNT);
        requestAnimationFrame(render);
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = particles[i];
        positions[i * 2] = p.x;
        positions[i * 2 + 1] = p.y;
        sizes[i] = p.size;
        alphas[i] = p.alpha;
        phases[i] = p.phase;
      }
      upload();
      requestAnimationFrame(render);
    })();

    // Events
    document.getElementById('tapRight').addEventListener('click', goNext);
    document.getElementById('tapLeft').addEventListener('click', goPrev);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') goNext();
      if (e.key === 'ArrowLeft') goPrev();
    });

    let touchStartX = 0;
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 50) {
        if (diff < 0) goNext();
        else goPrev();
      }
    }, { passive: true });

    buildPages();
    spawnCrystals();

    setTimeout(() => {
      document.getElementById('hint').classList.add('visible');
      setTimeout(() => document.getElementById('hint').classList.remove('visible'), 4000);
    }, 1600);

    function startAmbience() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 4;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.014;
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 260;
        const gain = audioCtx.createGain();
        gain.gain.value = 0.035;
        source.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        source.start();
      } catch (e) {}
    }

    let ambienceStarted = false;
    function tryStartAmbience() {
      if (!ambienceStarted) {
        ambienceStarted = true;
        startAmbience();
      }
    }
    document.addEventListener('click', tryStartAmbience, { once: true });
    document.addEventListener('touchstart', tryStartAmbience, { once: true });
  </script>
</body>
