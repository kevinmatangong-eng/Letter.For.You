<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Letter For You</title>
  <style>
    :root {
      --snow: #e8f4f8;
      --ice: #c5dce6;
      --deep-ice: #a8c5d4;
      --paper: #f7f1e3;
      --ink: #2c2c2c;
      --shadow: rgba(30, 50, 70, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Georgia', 'Times New Roman', serif;
      background: linear-gradient(180deg, #d4e8f0 0%, #e8f4f8 40%, #f0f7fa 100%);
      color: var(--ink);
      touch-action: manipulation;
    }

    /* Soft atmospheric fog */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.4) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* Distant snowy landscape */
    .landscape {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 35%;
      background: linear-gradient(180deg, transparent 0%, rgba(200, 220, 230, 0.3) 40%, rgba(180, 205, 220, 0.5) 100%);
      z-index: 0;
      pointer-events: none;
    }

    .landscape::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: -10%;
      width: 120%;
      height: 60%;
      background: 
        radial-gradient(ellipse 40% 30% at 20% 100%, rgba(190, 210, 225, 0.6) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 70% 100%, rgba(185, 205, 220, 0.5) 0%, transparent 70%),
        radial-gradient(ellipse 30% 25% at 45% 100%, rgba(195, 215, 230, 0.4) 0%, transparent 70%);
    }

    /* WebGL snow canvas */
    #snow-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Book container */
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      perspective: 2000px;
    }

    .book-wrapper {
      position: relative;
      width: min(92vw, 420px);
      height: min(78vh, 620px);
      max-height: 620px;
      transform-style: preserve-3d;
    }

    .book {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      box-shadow: 
        0 25px 50px -12px rgba(30, 50, 70, 0.35),
        0 10px 20px -5px rgba(30, 50, 70, 0.2),
        0 0 0 1px rgba(255,255,255,0.1);
      border-radius: 2px 8px 8px 2px;
    }

    /* Book cover base (left side spine feel) */
    .book::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 12px;
      background: linear-gradient(90deg, #d4c9b0, #e8dfc8);
      border-radius: 2px 0 0 2px;
      z-index: 20;
      box-shadow: inset -2px 0 4px rgba(0,0,0,0.08);
    }

    .page {
      position: absolute;
      inset: 0;
      background: var(--paper);
      background-image: 
        linear-gradient(90deg, rgba(0,0,0,0.03) 0%, transparent 8%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      border-radius: 1px 6px 6px 1px;
      padding: 8% 9% 8% 11%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      transform-origin: left center;
      transition: transform 1.1s cubic-bezier(0.645, 0.045, 0.355, 1), box-shadow 1.1s ease;
      backface-visibility: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.03);
    }

    .page.flipped {
      transform: rotateY(-180deg);
      box-shadow: -5px 0 15px rgba(0,0,0,0.1);
      z-index: 1;
    }

    .page-content {
      font-size: clamp(15px, 3.8vw, 17.5px);
      line-height: 1.72;
      color: #2a2a2a;
      letter-spacing: 0.01em;
      text-align: left;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 100%;
      overflow: hidden;
    }

    /* Slight paper aging */
    .page::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 80% 20%, rgba(220, 200, 160, 0.08) 0%, transparent 50%);
      pointer-events: none;
      border-radius: inherit;
    }

    /* Tap zones */
    .tap-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 50;
      cursor: pointer;
    }

    .tap-left { left: 0; }
    .tap-right { right: 0; }

    /* Subtle page number */
    .page-num {
      position: absolute;
      bottom: 4%;
      right: 8%;
      font-size: 11px;
      color: #8a8070;
      opacity: 0.6;
      font-family: Georgia, serif;
    }

    /* Soft ambient glow from snow */
    .book-wrapper::after {
      content: '';
      position: absolute;
      bottom: -30px;
      left: 10%;
      width: 80%;
      height: 40px;
      background: radial-gradient(ellipse, rgba(255,255,255,0.5) 0%, transparent 70%);
      filter: blur(8px);
      z-index: -1;
      pointer-events: none;
    }

    /* Instruction hint (fades) */
    .hint {
      position: fixed;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: #6a7a85;
      opacity: 0;
      transition: opacity 1.5s ease;
      z-index: 30;
      pointer-events: none;
      letter-spacing: 0.05em;
      text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    }

    .hint.visible {
      opacity: 0.7;
    }

    /* ===== Response panel ===== */
    .response-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.4s ease;
      background: rgba(210, 225, 235, 0.25);
      backdrop-filter: blur(2px);
    }

    .response-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .response-card {
      width: min(90vw, 380px);
      background: var(--paper);
      background-image: 
        linear-gradient(90deg, rgba(0,0,0,0.025) 0%, transparent 8%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      border-radius: 3px 8px 8px 3px;
      padding: 32px 28px 28px;
      box-shadow: 
        0 20px 40px -10px rgba(30, 50, 70, 0.28),
        0 8px 16px -4px rgba(30, 50, 70, 0.15);
      transform: translateY(18px);
      transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
      text-align: center;
    }

    .response-overlay.visible .response-card {
      transform: translateY(0);
    }

    .response-card h2 {
      font-size: 16px;
      font-weight: normal;
      color: #3a3a3a;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .response-card p {
      font-size: 13.5px;
      color: #6a655c;
      line-height: 1.55;
      margin-bottom: 22px;
    }

    .response-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 18px;
    }

    .response-btn {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 15px;
      padding: 10px 28px;
      border: 1px solid #c8bfa8;
      background: rgba(255,255,255,0.45);
      color: #2c2c2c;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.15s ease;
      min-width: 90px;
    }

    .response-btn:hover,
    .response-btn:focus {
      background: rgba(255,255,255,0.75);
      border-color: #a89f88;
      outline: none;
    }

    .response-btn:active {
      transform: scale(0.97);
    }

    .response-or {
      font-size: 12.5px;
      color: #8a8070;
      margin-bottom: 12px;
    }

    .response-textarea {
      width: 100%;
      min-height: 72px;
      max-height: 120px;
      resize: vertical;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14.5px;
      line-height: 1.5;
      color: #2a2a2a;
      background: rgba(255,255,255,0.5);
      border: 1px solid #d0c6b0;
      border-radius: 3px;
      padding: 10px 12px;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .response-textarea:focus {
      border-color: #a89f88;
    }

    .response-textarea::placeholder {
      color: #9a9080;
    }

    .response-send {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 13.5px;
      padding: 8px 22px;
      border: 1px solid #c8bfa8;
      background: rgba(255,255,255,0.4);
      color: #3a3a3a;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.25s ease;
    }

    .response-send:hover {
      background: rgba(255,255,255,0.7);
    }

    .response-send:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .response-thanks {
      display: none;
      font-size: 15px;
      color: #3a3a3a;
      line-height: 1.6;
      padding: 12px 0 4px;
    }

    .response-thanks.visible {
      display: block;
    }

    .response-form.hidden,
    .response-buttons.hidden,
    .response-or.hidden {
      display: none;
    }

    .close-response {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 18px;
      color: #9a9080;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }

    .close-response:hover {
      color: #6a655c;
    }

    .response-card {
      position: relative;
    }

    /* Responsive adjustments */
    @media (max-height: 600px) {
      .book-wrapper {
        height: min(85vh, 520px);
      }
      .page-content {
        font-size: clamp(13.5px, 3.5vw, 15.5px);
        line-height: 1.6;
      }
    }

    @media (max-width: 380px) {
      .page {
        padding: 7% 7% 7% 10%;
      }
      .page-content {
        font-size: 14.5px;
      }
      .response-card {
        padding: 26px 20px 22px;
      }
    }
  </style>
</head>
<body>
  <div class="landscape"></div>
  <canvas id="snow-canvas"></canvas>

  <div class="scene">
    <div class="book-wrapper">
      <div class="book" id="book">
        <!-- Pages will be injected here -->
      </div>
      <div class="tap-zone tap-left" id="tapLeft"></div>
      <div class="tap-zone tap-right" id="tapRight"></div>
    </div>
  </div>

  <div class="hint" id="hint">Tap the right side to turn the page</div>

  <!-- Quiet response after the letter -->
  <div class="response-overlay" id="responseOverlay">
    <div class="response-card">
      <button class="close-response" id="closeResponse" aria-label="Close">×</button>

      <div id="responseForm">
        <h2>Your answer</h2>
        <p>You can say yes, no, or write whatever feels true.</p>

        <div class="response-buttons" id="responseButtons">
          <button class="response-btn" data-answer="yes">Yes</button>
          <button class="response-btn" data-answer="no">No</button>
        </div>

        <div class="response-or">or write it in your own words</div>

        <textarea
          class="response-textarea"
          id="responseText"
          placeholder="Whatever you genuinely feel…"
          maxlength="1200"
        ></textarea>

        <button class="response-send" id="responseSend" disabled>Leave this answer</button>
      </div>

      <div class="response-thanks" id="responseThanks">
        It’s received.<br>
        Whatever you chose is enough.
      </div>
    </div>
  </div>

  <script>
    const pages = [
      `Hey, I just want to make one last deal with you, and I’m going to be completely honest about it.`,

      `I’m currently working on something that means a lot to me. For the first time in a while, I feel like I’m starting to understand that maybe my existence isn’t meaningless or absurd. Maybe I simply haven’t discovered what I’m meant to find yet.`,

      `So this is my deal. You can answer yes, no, or give me whatever answer you genuinely feel is right.`,

      `I’m going to disappear for 165 days. I know you may have wished for me to disappear from your life completely, and I understand that. But there’s something I promised myself after everything we shared throughout our relationship, and I want to keep that promise. I don’t want the ending of our relationship to be defined by becoming strangers.`,

      `After those 165 days, I may contact you again. There’s also a chance I won’t. I honestly don’t know what the future will bring, and I don’t want to make any promises about something I can’t control.`,

      `If you happen to have a boyfriend by then, I hope you can tell him about this agreement if you think it’s necessary. I don’t want to cause problems for you or for anyone else. This isn’t meant to threaten you, pressure you, or interfere with your life. I’m simply giving myself these 165 days to work on something important.`,

      `There’s also something I want to give you. It’s a secret for now, so I won’t tell you what it is. Whether I actually get the chance to give it to you is something I don’t know yet.\n\nSo, goodbye for now. Take care of yourself, and I genuinely hope life treats you well. Whatever happens after these 165 days, I’ll accept it.`
    ];

    const book = document.getElementById('book');
    let currentPage = 0;
    let isAnimating = false;
    let responseShown = false;

    // Create pages (stacked, top page is highest z)
    function buildPages() {
      pages.forEach((text, i) => {
        const page = document.createElement('div');
        page.className = 'page';
        page.dataset.index = i;
        page.style.zIndex = pages.length - i;

        const content = document.createElement('div');
        content.className = 'page-content';
        content.textContent = text;

        const num = document.createElement('div');
        num.className = 'page-num';
        num.textContent = `${i + 1}`;

        page.appendChild(content);
        page.appendChild(num);
        book.appendChild(page);
      });
    }

    function updateVisibility() {
      const allPages = document.querySelectorAll('.page');
      allPages.forEach((page, i) => {
        if (i < currentPage) {
          page.classList.add('flipped');
          page.style.zIndex = i;
        } else {
          page.classList.remove('flipped');
          page.style.zIndex = pages.length - i;
        }
      });
    }

    function showResponsePanel() {
      if (responseShown) return;
      // Small delay so the last page can settle
      setTimeout(() => {
        document.getElementById('responseOverlay').classList.add('visible');
        responseShown = true;
      }, 1600);
    }

    function goNext() {
      if (isAnimating) return;

      if (currentPage >= pages.length - 1) {
        // Already on last page — offer the response
        showResponsePanel();
        return;
      }

      isAnimating = true;
      currentPage++;
      updateVisibility();
      playPageSound();

      if (currentPage === pages.length - 1) {
        // Reached the final page — later show the quiet option
        setTimeout(() => {
          isAnimating = false;
          showResponsePanel();
        }, 1150);
      } else {
        setTimeout(() => { isAnimating = false; }, 1150);
      }
    }

    function goPrev() {
      if (isAnimating || currentPage <= 0) return;
      isAnimating = true;
      currentPage--;
      updateVisibility();
      playPageSound();
      setTimeout(() => { isAnimating = false; }, 1150);
    }

    // Subtle paper sound using Web Audio API
    let audioCtx;
    function playPageSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;

        const bufferSize = audioCtx.sampleRate * 0.15;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.5) * 0.15;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1200;
        filter.Q.value = 0.8;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
      } catch (e) {}
    }

    // =====================
    // Response handling
    // =====================
    const responseOverlay = document.getElementById('responseOverlay');
    const responseText = document.getElementById('responseText');
    const responseSend = document.getElementById('responseSend');
    const responseThanks = document.getElementById('responseThanks');
    const responseForm = document.getElementById('responseForm');

    function saveAnswer(answer) {
      try {
        localStorage.setItem('letter-for-you-answer', JSON.stringify({
          answer: answer,
          timestamp: new Date().toISOString()
        }));
      } catch (e) {}
    }

    function showThanks() {
      responseForm.style.display = 'none';
      responseThanks.classList.add('visible');

      // Soft close after a quiet moment
      setTimeout(() => {
        responseOverlay.classList.remove('visible');
      }, 4200);
    }

    document.querySelectorAll('.response-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const answer = btn.dataset.answer;
        saveAnswer(answer);
        showThanks();
      });
    });

    responseText.addEventListener('input', () => {
      responseSend.disabled = responseText.value.trim().length === 0;
    });

    responseSend.addEventListener('click', () => {
      const text = responseText.value.trim();
      if (!text) return;
      saveAnswer(text);
      showThanks();
    });

    document.getElementById('closeResponse').addEventListener('click', () => {
      responseOverlay.classList.remove('visible');
    });

    // Allow closing by tapping outside the card
    responseOverlay.addEventListener('click', (e) => {
      if (e.target === responseOverlay) {
        responseOverlay.classList.remove('visible');
      }
    });

    // =====================
    // WebGL Snow System
    // =====================
    (function initWebGLSnow() {
      const canvas = document.getElementById('snow-canvas');
      const gl = canvas.getContext('webgl', {
        alpha: true,
        premultipliedAlpha: false,
        antialias: false,
        depth: false
      });

      if (!gl) {
        console.warn('WebGL not available');
        return;
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        gl.viewport(0, 0, canvas.width, canvas.height);
      }
      resize();
      window.addEventListener('resize', resize);

      const vsSource = `
        attribute vec2 a_position;
        attribute float a_size;
        attribute float a_alpha;
        attribute float a_phase;

        uniform vec2 u_resolution;
        uniform float u_time;

        varying float v_alpha;
        varying float v_phase;

        void main() {
          vec2 clip = (a_position / u_resolution) * 2.0 - 1.0;
          clip.y = -clip.y;
          gl_Position = vec4(clip, 0.0, 1.0);
          gl_PointSize = a_size;
          v_alpha = a_alpha;
          v_phase = a_phase;
        }
      `;

      const fsSource = `
        precision mediump float;
        varying float v_alpha;
        varying float v_phase;

        void main() {
          vec2 c = gl_PointCoord - 0.5;
          float dist = length(c);
          float alpha = smoothstep(0.5, 0.15, dist);
          float crystal = 0.85 + 0.15 * sin(v_phase * 6.28318 + dist * 12.0);
          alpha *= crystal;
          vec3 color = mix(vec3(0.92, 0.96, 0.99), vec3(1.0), 0.6);
          gl_FragColor = vec4(color, alpha * v_alpha * 0.85);
        }
      `;

      function createShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error(gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      }

      const vs = createShader(gl.VERTEX_SHADER, vsSource);
      const fs = createShader(gl.FRAGMENT_SHADER, fsSource);
      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error(gl.getProgramInfoLog(program));
        return;
      }

      gl.useProgram(program);

      const aPosition = gl.getAttribLocation(program, 'a_position');
      const aSize = gl.getAttribLocation(program, 'a_size');
      const aAlpha = gl.getAttribLocation(program, 'a_alpha');
      const aPhase = gl.getAttribLocation(program, 'a_phase');
      const uResolution = gl.getUniformLocation(program, 'u_resolution');
      const uTime = gl.getUniformLocation(program, 'u_time');

      const isMobile = /Mobi|Android/i.test(navigator.userAgent) || window.innerWidth < 700;
      const PARTICLE_COUNT = isMobile ? 420 : 780;

      const particles = [];
      const positions = new Float32Array(PARTICLE_COUNT * 2);
      const sizes = new Float32Array(PARTICLE_COUNT);
      const alphas = new Float32Array(PARTICLE_COUNT);
      const phases = new Float32Array(PARTICLE_COUNT);

      function createParticle(i, resetY = false) {
        const depth = Math.random();
        const sizeBase = 1.2 + depth * 4.8 + Math.random() * 1.4;

        particles[i] = {
          x: Math.random() * canvas.width,
          y: resetY ? -20 - Math.random() * 80 : Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.35,
          vy: 0.35 + depth * 0.9 + Math.random() * 0.4,
          size: sizeBase * (window.devicePixelRatio > 1.5 ? 1.15 : 1),
          alpha: 0.25 + depth * 0.45 + Math.random() * 0.15,
          phase: Math.random() * Math.PI * 2,
          depth: depth,
          turbulence: 0.3 + Math.random() * 0.7,
          life: 0
        };
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        createParticle(i);
      }

      const posBuffer = gl.createBuffer();
      const sizeBuffer = gl.createBuffer();
      const alphaBuffer = gl.createBuffer();
      const phaseBuffer = gl.createBuffer();

      function uploadBuffers() {
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, sizes, gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, alphaBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, alphas, gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, phaseBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, phases, gl.DYNAMIC_DRAW);
      }

      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.clearColor(0, 0, 0, 0);

      let wind = 0;
      let windTarget = 0;
      let gustTimer = 0;
      let lastTime = performance.now();

      function update(dt) {
        gustTimer -= dt;
        if (gustTimer <= 0) {
          windTarget = (Math.random() - 0.5) * 1.1;
          gustTimer = 2.5 + Math.random() * 5.5;
        }
        wind += (windTarget - wind) * 0.4 * dt;

        const w = canvas.width;
        const h = canvas.height;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const p = particles[i];

          p.vy += 0.012 * dt;
          p.vy = Math.min(p.vy, 1.6 + p.depth * 1.4);

          const turb = Math.sin(p.phase + performance.now() * 0.0012 * p.turbulence) * 0.45 * p.turbulence;
          p.vx += (wind * (0.4 + p.depth * 0.6) + turb - p.vx) * 0.8 * dt;

          p.x += p.vx * 60 * dt;
          p.y += p.vy * 60 * dt;
          p.phase += 0.8 * dt * p.turbulence;
          p.life += dt;

          let a = p.alpha;
          if (p.y < 40) a *= p.y / 40;

          if (p.y > h + 30 || p.x < -40 || p.x > w + 40) {
            createParticle(i, true);
            continue;
          }

          positions[i * 2] = p.x;
          positions[i * 2 + 1] = p.y;
          sizes[i] = p.size;
          alphas[i] = a;
          phases[i] = p.phase;
        }
      }

      function render(time) {
        const now = performance.now();
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        update(dt);

        gl.uniform2f(uResolution, canvas.width, canvas.height);
        gl.uniform1f(uTime, time * 0.001);

        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, positions);
        gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuffer);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, sizes);
        gl.bindBuffer(gl.ARRAY_BUFFER, alphaBuffer);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, alphas);
        gl.bindBuffer(gl.ARRAY_BUFFER, phaseBuffer);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, phases);

        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.enableVertexAttribArray(aPosition);
        gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuffer);
        gl.enableVertexAttribArray(aSize);
        gl.vertexAttribPointer(aSize, 1, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, alphaBuffer);
        gl.enableVertexAttribArray(aAlpha);
        gl.vertexAttribPointer(aAlpha, 1, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, phaseBuffer);
        gl.enableVertexAttribArray(aPhase);
        gl.vertexAttribPointer(aPhase, 1, gl.FLOAT, false, 0, 0);

        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.POINTS, 0, PARTICLE_COUNT);

        requestAnimationFrame(render);
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = particles[i];
        positions[i * 2] = p.x;
        positions[i * 2 + 1] = p.y;
        sizes[i] = p.size;
        alphas[i] = p.alpha;
        phases[i] = p.phase;
      }
      uploadBuffers();

      requestAnimationFrame(render);
    })();

    // Event listeners
    document.getElementById('tapRight').addEventListener('click', goNext);
    document.getElementById('tapLeft').addEventListener('click', goPrev);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') goNext();
      if (e.key === 'ArrowLeft') goPrev();
    });

    let touchStartX = 0;
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 50) {
        if (diff < 0) goNext();
        else goPrev();
      }
    }, { passive: true });

    // Init
    buildPages();

    setTimeout(() => {
      document.getElementById('hint').classList.add('visible');
      setTimeout(() => {
        document.getElementById('hint').classList.remove('visible');
      }, 4000);
    }, 1800);

    function startAmbience() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 4;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * 0.015;
        }
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 280;

        const gain = audioCtx.createGain();
        gain.gain.value = 0.04;

        source.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        source.start();
      } catch (e) {}
    }

    let ambienceStarted = false;
    function tryStartAmbience() {
      if (!ambienceStarted) {
        ambienceStarted = true;
        startAmbience();
      }
    }
    document.addEventListener('click', tryStartAmbience, { once: true });
    document.addEventListener('touchstart', tryStartAmbience, { once: true });
  </script>
</body>
