<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Letter For You</title>
  <style>
    :root { --snow: #e8f4f8; --ice: #b8d4e3; --deep-ice: #8eb8cc; --paper: #f7f1e3; --ink: #2c2c2c; }

    .book-wrapper::before { content: ''; position: absolute; inset: -5px; border-radius: 5px 12px 12px 5px; background: linear-gradient(145deg, rgba(220,240,255,0.55) 0%, rgba(200,230,250,0.2) 30%, transparent 50%, rgba(190,220,240,0.25) 100%); z-index: -1; pointer-events: none; filter: blur(1.5px); }
    .book-frost { position: absolute; inset: -8px; pointer-events: none; z-index: 25; overflow: visible; }
    .book-frost span { position: absolute; width: 7px; height: 7px; background: linear-gradient(135deg, #fff, rgba(180,220,245,0.6)); clip-path: polygon(50% 0%, 65% 35%, 100% 35%, 70% 57%, 82% 100%, 50% 75%, 18% 100%, 30% 57%, 0% 35%, 35% 35%); opacity: 0.7; filter: drop-shadow(0 0 2px rgba(200,230,250,0.6)); }
    .book::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: linear-gradient(90deg, #cfc4aa, #e4d9c0); border-radius: 2px 0 0 2px; z-index: 20; box-shadow: inset -2px 0 4px rgba(0,0,0,0.08); }

    .page-note.expanded .note-text { font-size: 15px; line-height: 1.55; }
    @media (max-height: 600px) { .book-wrapper { height: min(72vh, 460px); } .page-content { font-size: clamp(13px, 3.3vw, 14.5px); line-height: 1.58; } }
    @media (max-width: 380px) { .page { padding: 6.5% 7% 6.5% 9.5%; } .page-content { font-size: 13.8px; } .response-card { padding: 28px 20px 24px; } .response-btn { padding: 12px 28px; min-width: 96px; } }

</head>
<body>
  <div class="landscape"></div>
  <canvas id="snow-canvas"></canvas>
  <div class="ice-layer" id="iceLayer"></div>
  <div class="frost-frame"></div>
  <div class="scene">
    <div class="book-wrapper">
      <div class="book-frost" id="bookFrost"></div>
      <div class="page-note" id="pageNote"><div class="note-text">or simply reply in Spotify</div></div>
      <div class="book" id="book"></div>
      <div class="tap-zone tap-left" id="tapLeft"></div>
      <div class="tap-zone tap-right" id="tapRight"></div>
    </div>
  </div>
  <div class="hint" id="hint">Tap the right side to turn the page</div>
  <div class="response-overlay" id="responseOverlay">
    <div class="response-card">
      <button class="close-response" id="closeResponse" aria-label="Close">×</button>
      <div id="responseForm">
        <h2>Your answer</h2>
        <p>Yes or no.</p>
        <div class="response-buttons">
          <button class="response-btn" data-answer="Yes">Yes</button>
          <button class="response-btn" data-answer="No">No</button>
        </div>
        <div class="response-spotify">or simply reply in Spotify</div>
      </div>
      <div class="response-thanks" id="responseThanks"><div class="chosen" id="chosenAnswer"></div></div>
    </div>
  </div>
  <script>
    const pages = [
      `Hey, I just want to make one last deal with you, and I’m going to be completely honest about it.`,
      `I’m currently working on something that means a lot to me. For the first time in a while, I feel like I’m starting to understand that maybe my existence isn’t meaningless or absurd. Maybe I simply haven’t discovered what I’m meant to find yet.`,
      `So this is my deal. You can answer yes, no, or give me whatever answer you genuinely feel is right.`,
      `I’m going to disappear for 165 days. I know you may have wished for me to disappear from your life completely, and I understand that. But there’s something I promised myself after everything we shared throughout our relationship, and I want to keep that promise. I don’t want the ending of our relationship to be defined by becoming strangers.`,
      `After those 165 days, I may contact you again. There’s also a chance I won’t. I honestly don’t know what the future will bring, and I don’t want to make any promises about something I can’t control.`,
      `If you happen to have a boyfriend by then, I hope you can tell him about this agreement if you think it’s necessary. I don’t want to cause problems for you or for anyone else. This isn’t meant to threaten you, pressure you, or interfere with your life. I’m simply giving myself these 165 days to work on something important.`,
      `There’s also something I want to give you. It’s a secret for now, so I won’t tell you what it is. Whether I actually get the chance to give it to you is something I don’t know yet.\n\nSo, goodbye for now. Take care of yourself, and I genuinely hope life treats you well. Whatever happens after these 165 days, I’ll accept it.`
    ];
    const book = document.getElementById('book');
    let currentPage = 0, isAnimating = false, responseShown = false;
    function buildPages() {
      pages.forEach((text, i) => {
        const page = document.createElement('div');
        page.className = 'page';
        page.style.zIndex = pages.length - i;
        const content = document.createElement('div');
        content.className = 'page-content';
        content.textContent = text;
        const num = document.createElement('div');
        num.className = 'page-num';
        num.textContent = `${i + 1}`;
        page.appendChild(content);
        page.appendChild(num);
        book.appendChild(page);
      });
    }
    function updateVisibility() {
      document.querySelectorAll('.page').forEach((page, i) => {
        if (i < currentPage) { page.classList.add('flipped'); page.style.zIndex = i; }
        else { page.classList.remove('flipped'); page.style.zIndex = pages.length - i; }
      });
      if (typeof updatePageNote === 'function') updatePageNote();
    }
    function showResponsePanel() {
      if (responseShown) return;
      setTimeout(() => { document.getElementById('responseOverlay').classList.add('visible'); responseShown = true; }, 1500);
    }
    function goNext() {
      if (isAnimating) return;
      if (currentPage >= pages.length - 1) { showResponsePanel(); return; }
      isAnimating = true; currentPage++; updateVisibility(); playPageSound();
      if (currentPage === pages.length - 1) setTimeout(() => { isAnimating = false; showResponsePanel(); }, 1100);
      else setTimeout(() => { isAnimating = false; }, 1100);
    }
    function goPrev() {
      if (isAnimating || currentPage <= 0) return;
      isAnimating = true; currentPage--; updateVisibility(); playPageSound();
      setTimeout(() => { isAnimating = false; }, 1100);
    }
    let audioCtx;
    function playPageSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const bufferSize = audioCtx.sampleRate * 0.14;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.5) * 0.14;
        const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 1150; filter.Q.value = 0.8;
        const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.07, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start(now);
      } catch (e) {}
    }
    const responseOverlay = document.getElementById('responseOverlay');
    const responseThanks = document.getElementById('responseThanks');
    const responseForm = document.getElementById('responseForm');
    const chosenAnswer = document.getElementById('chosenAnswer');
    function noteAnswer(answer) {
      try { localStorage.setItem('letter-for-you-answer', JSON.stringify({ answer, timestamp: new Date().toISOString() })); } catch (e) {}
      chosenAnswer.textContent = answer;
      responseForm.style.display = 'none';
      responseThanks.classList.add('visible');
      setTimeout(() => responseOverlay.classList.remove('visible'), 2800);
    }
    const pageNote = document.getElementById('pageNote');
    function updatePageNote() {
      if (currentPage === pages.length - 1) pageNote.classList.add('visible');
      else pageNote.classList.remove('visible', 'expanded');
    }
    pageNote.addEventListener('click', (e) => { e.stopPropagation(); pageNote.classList.toggle('expanded'); });
    document.querySelectorAll('.response-btn').forEach(btn => btn.addEventListener('click', () => noteAnswer(btn.dataset.answer)));
    document.getElementById('closeResponse').addEventListener('click', () => responseOverlay.classList.remove('visible'));
    responseOverlay.addEventListener('click', (e) => { if (e.target === responseOverlay) responseOverlay.classList.remove('visible'); });
    function placeBookFrost() {
      const el = document.getElementById('bookFrost');
      [{top:'2%',left:'8%'},{top:'1%',right:'12%'},{top:'6%',right:'3%'},{bottom:'4%',left:'5%'},{bottom:'2%',right:'9%'},{top:'40%',left:'-2%'},{top:'55%',right:'-1%'},{bottom:'18%',left:'2%'}].forEach(pos => {
        const s = document.createElement('span');
        Object.assign(s.style, pos);
        s.style.transform = `rotate(${Math.random()*60-30}deg) scale(${0.6+Math.random()*0.7})`;
        s.style.opacity = 0.45 + Math.random() * 0.35;
        el.appendChild(s);
      });
    }
    function spawnCrystals() {
      const layer = document.getElementById('iceLayer');
      for (let i = 0; i < 18; i++) {
        const c = document.createElement('div');
        c.className = 'crystal';
        c.style.left = Math.random() * 100 + '%';
        c.style.animationDuration = (10 + Math.random() * 15) + 's';
        c.style.animationDelay = (Math.random() * 14) + 's';
        c.style.transform = `scale(${0.45 + Math.random()})`;
        layer.appendChild(c);
      }
    }
    (function initWebGLSnow() {
      const canvas = document.getElementById('snow-canvas');
      const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: false, antialias: false, depth: false });
      if (!gl) return;
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px';
        gl.viewport(0, 0, canvas.width, canvas.height);
      }
      resize(); window.addEventListener('resize', resize);
      const vsSource = `attribute vec2 a_position; attribute float a_size; attribute float a_alpha; attribute float a_phase; uniform vec2 u_resolution; varying float v_alpha; varying float v_phase; void main() { vec2 clip = (a_position / u_resolution) * 2.0 - 1.0; clip.y = -clip.y; gl_Position = vec4(clip, 0.0, 1.0); gl_PointSize = a_size; v_alpha = a_alpha; v_phase = a_phase; }`;
      const fsSource = `precision mediump float; varying float v_alpha; varying float v_phase; void main() { vec2 c = gl_PointCoord - 0.5; float dist = length(c); float alpha = smoothstep(0.5, 0.11, dist); float angle = atan(c.y, c.x); float facets = 0.72 + 0.28 * cos(angle * 6.0 + v_phase); alpha *= facets; vec3 color = mix(vec3(0.86, 0.93, 0.99), vec3(1.0), 0.5); gl_FragColor = vec4(color, alpha * v_alpha * 0.84); }`;
      function createShader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
      const program = gl.createProgram();
      gl.attachShader(program, createShader(gl.VERTEX_SHADER, vsSource));
      gl.attachShader(program, createShader(gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(program); gl.useProgram(program);
      const aPosition = gl.getAttribLocation(program, 'a_position');
      const aSize = gl.getAttribLocation(program, 'a_size');
      const aAlpha = gl.getAttribLocation(program, 'a_alpha');
      const aPhase = gl.getAttribLocation(program, 'a_phase');
      const uResolution = gl.getUniformLocation(program, 'u_resolution');
      const isMobile = /Mobi|Android/i.test(navigator.userAgent) || window.innerWidth < 700;
      const N = isMobile ? 500 : 900;
      const particles = [];
      const positions = new Float32Array(N * 2);
      const sizes = new Float32Array(N);
      const alphas = new Float32Array(N);
      const phases = new Float32Array(N);
      function createParticle(i, resetY) {
        const depth = Math.random();
        particles[i] = { x: Math.random() * canvas.width, y: resetY ? -30 - Math.random() * 100 : Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.4, vy: 0.3 + depth * 0.95 + Math.random() * 0.4, size: (1.4 + depth * 5.4 + Math.random() * 1.6) * (window.devicePixelRatio > 1.5 ? 1.1 : 1), alpha: 0.24 + depth * 0.5 + Math.random() * 0.15, phase: Math.random() * Math.PI * 2, depth, turbulence: 0.3 + Math.random() * 0.7 };
      }
      for (let i = 0; i < N; i++) createParticle(i);
      const posBuffer = gl.createBuffer(), sizeBuffer = gl.createBuffer(), alphaBuffer = gl.createBuffer(), phaseBuffer = gl.createBuffer();
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.clearColor(0,0,0,0);
      let wind = 0, windTarget = 0, gustTimer = 0, lastTime = performance.now();
      function update(dt) {
        gustTimer -= dt;
        if (gustTimer <= 0) { windTarget = (Math.random() - 0.5) * 1.25; gustTimer = 2 + Math.random() * 5; }
        wind += (windTarget - wind) * 0.4 * dt;
        for (let i = 0; i < N; i++) {
          const p = particles[i];
          p.vy = Math.min(p.vy + 0.013 * dt, 1.7 + p.depth * 1.3);
          const turb = Math.sin(p.phase + performance.now() * 0.0011 * p.turbulence) * 0.5 * p.turbulence;
          p.vx += (wind * (0.4 + p.depth * 0.6) + turb - p.vx) * 0.8 * dt;
          p.x += p.vx * 60 * dt; p.y += p.vy * 60 * dt; p.phase += 0.9 * dt * p.turbulence;
          let a = p.alpha; if (p.y < 50) a *= p.y / 50;
          if (p.y > canvas.height + 40 || p.x < -60 || p.x > canvas.width + 60) { createParticle(i, true); continue; }
          positions[i*2] = p.x; positions[i*2+1] = p.y; sizes[i] = p.size; alphas[i] = a; phases[i] = p.phase;
        }
      }
      function render() {
        const now = performance.now(); update(Math.min((now - lastTime) / 1000, 0.05)); lastTime = now;
        gl.uniform2f(uResolution, canvas.width, canvas.height);
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer); gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW); gl.enableVertexAttribArray(aPosition); gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuffer); gl.bufferData(gl.ARRAY_BUFFER, sizes, gl.DYNAMIC_DRAW); gl.enableVertexAttribArray(aSize); gl.vertexAttribPointer(aSize, 1, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, alphaBuffer); gl.bufferData(gl.ARRAY_BUFFER, alphas, gl.DYNAMIC_DRAW); gl.enableVertexAttribArray(aAlpha); gl.vertexAttribPointer(aAlpha, 1, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, phaseBuffer); gl.bufferData(gl.ARRAY_BUFFER, phases, gl.DYNAMIC_DRAW); gl.enableVertexAttribArray(aPhase); gl.vertexAttribPointer(aPhase, 1, gl.FLOAT, false, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.POINTS, 0, N); requestAnimationFrame(render);
      }
      for (let i = 0; i < N; i++) { positions[i*2] = particles[i].x; positions[i*2+1] = particles[i].y; sizes[i] = particles[i].size; alphas[i] = particles[i].alpha; phases[i] = particles[i].phase; }
      requestAnimationFrame(render);
    })();
    document.getElementById('tapRight').addEventListener('click', goNext);
    document.getElementById('tapLeft').addEventListener('click', goPrev);
    document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight' || e.key === ' ') goNext(); if (e.key === 'ArrowLeft') goPrev(); });
    let touchStartX = 0;
    document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    document.addEventListener('touchend', (e) => { const diff = e.changedTouches[0].screenX - touchStartX; if (Math.abs(diff) > 50) diff < 0 ? goNext() : goPrev(); }, { passive: true });
    buildPages(); placeBookFrost(); spawnCrystals();
    setTimeout(() => { document.getElementById('hint').classList.add('visible'); setTimeout(() => document.getElementById('hint').classList.remove('visible'), 4000); }, 1600);
    function startAmbience() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 4;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.014;
        const source = audioCtx.createBufferSource(); source.buffer = buffer; source.loop = true;
        const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 250;
        const gain = audioCtx.createGain(); gain.gain.value = 0.035;
        source.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); source.start();
      } catch (e) {}
    }
    let ambienceStarted = false;
    function tryStartAmbience() { if (!ambienceStarted) { ambienceStarted = true; startAmbience(); } }
    document.addEventListener('click', tryStartAmbience, { once: true });
    document.addEventListener('touchstart', tryStartAmbience, { once: true });
  </script>
